packages:
  # Include all of the core configuration.
  core: !include nanoc6-bluetooth.yaml
  # OTA updates from GitHub Pages.
  updates: !include ../../packages/updates.yaml
  # Time-limited window for Wi-Fi credential and API key provisioning.
  provisioning: !include ../../packages/provisioning.yaml
  # Improv Wi-Fi provisioning over BLE and USB serial.
  improv: !include ../../packages/provisioning-esp32.yaml
  # Only release-signed OTA images are accepted.
  signing: !include ../../packages/signing-esp32.yaml

esphome:
  # This will allow for project identification, configuration and updates.
  project:
    name: "M5Stack.NanoC6-Bluetooth-Proxy"
    version: dev  # Replaced by the github workflows with the release version
