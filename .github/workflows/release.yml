name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the most recent draft)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || 'latest-draft' }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish draft release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve draft release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! releases=$(gh api "repos/${GH_REPO}/releases?per_page=100"); then
            echo "::error::Failed to list releases"
            exit 1
          fi
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            # Ignore drafts whose tag was reset to an untagged-* placeholder
            # (a stray PATCH without tag_name causes this) - publishing one
            # would create a release under the placeholder tag.
            tag=$(jq -r \
              '[.[] | select(.draft == true and (.tag_name | startswith("untagged-") | not))]
                | first | .tag_name // ""' \
              <<< "${releases}")
          fi
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "::error::No draft release found"
            exit 1
          fi
          release=$(jq --arg tag "${tag}" \
            '[.[] | select(.tag_name == $tag and .draft == true)] | first' <<< "${releases}")
          if [[ -z "${release}" || "${release}" == "null" ]]; then
            echo "::error::Draft release ${tag} not found"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.id' <<< "${release}")" >> "$GITHUB_OUTPUT"
          # Do NOT use the draft's html_url: for a draft it always points at
          # an untagged-* placeholder that 404s once the release is
          # published. The final URL is deterministic from the tag.
          echo "url=https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_BODY_EOF"
            jq -r '.body' <<< "${release}"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved draft release: ${tag}"

      - name: Download manifest assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.find.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # Work with the release id rather than `gh release download <tag>`:
          # gh resolves draft tags via the singular releases/tags/{tag}
          # endpoint, which is unreliable for drafts, while lookups by id
          # always work.
          if ! assets=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" \
            --paginate \
            --jq '.[] | select((.name | endswith(".manifest.json")) or (.name | endswith(".ota.bin"))) | "\(.id)\t\(.name)"'); then
            echo "::error::Failed to list draft release assets"
            exit 1
          fi
          if [[ -z "${assets}" ]]; then
            echo "::error::No *.manifest.json assets found on draft release"
            exit 1
          fi
          # --allow-escape-sequences (gh >= 2.97.0): gh refuses to write a
          # response body containing terminal escape bytes, which a manifest
          # carrying an escape byte in the embedded release body would trip.
          while IFS=$'\t' read -r asset_id asset_name; do
            echo "Downloading ${asset_name}"
            gh api --allow-escape-sequences -H "Accept: application/octet-stream" \
              "repos/${GH_REPO}/releases/assets/${asset_id}" \
              > "assets/${asset_name}"
          done <<< "${assets}"

      - name: Sign ESP32 OTA images
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          OTA_SIGNING_KEY_V1: ${{ secrets.OTA_SIGNING_KEY_V1 }}
        run: |
          set -euo pipefail
          # ESP32 factory firmware only boots OTA images carrying a valid
          # signature, so every ESP32-family *.ota.bin must be signed before
          # the release goes out. Most devices use the Secure Boot V2 rsa3072
          # scheme (packages/signing-esp32.yaml, OTA_SIGNING_KEY); devices on
          # pre-3.0 ESP32 silicon use the legacy V1 ECDSA scheme
          # (OTA_SIGNING_KEY_V1) and are listed in
          # .github/ota-signing-v1-devices.txt.
          # ESP8266 images are skipped: no signing support on that platform.
          V1_DEVICES=$(grep -vE '^\s*(#|$)' .github/ota-signing-v1-devices.txt || true)
          scheme_for() {
            local d
            for d in ${V1_DEVICES}; do
              if [[ "$1" == "${d}"-* || "$1" == "${d}".* ]]; then
                echo 1
                return
              fi
            done
            echo 2
          }
          mapfile -t targets < <(
            jq -r '.builds[] | select(.ota != null and (.chipFamily | startswith("ESP8266") | not)) | .ota.path' \
              assets/*.manifest.json | sort -u)
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No ESP32 OTA images to sign"
            exit 0
          fi
          pip install --quiet "esptool>=4.7,<5"
          key_file_v2=$(mktemp)
          key_file_v1=$(mktemp)
          printf '%s\n' "${OTA_SIGNING_KEY}" > "${key_file_v2}"
          printf '%s\n' "${OTA_SIGNING_KEY_V1}" > "${key_file_v1}"
          for bin in "${targets[@]}"; do
            if [[ ! -f "assets/${bin}" ]]; then
              echo "::error::Manifest references ${bin} but it is not a draft release asset"
              exit 1
            fi
            scheme=$(scheme_for "${bin}")
            if [[ "${scheme}" == "1" ]]; then
              key_file="${key_file_v1}"
              secret_name=OTA_SIGNING_KEY_V1
              secret_value="${OTA_SIGNING_KEY_V1}"
            else
              key_file="${key_file_v2}"
              secret_name=OTA_SIGNING_KEY
              secret_value="${OTA_SIGNING_KEY}"
            fi
            if [[ -z "${secret_value}" ]]; then
              echo "::error::${secret_name} secret is not set; ${bin} would be rejected by its device. Add the private key to the release environment."
              exit 1
            fi
            # A re-run of this workflow downloads already-signed images; skip
            # re-signing those (the md5 update below is idempotent either way).
            # verify_signature exits non-zero for unsigned images and images
            # signed by a different key; do NOT use signature_info_v2 here -
            # it exits 0 even when no signature block exists.
            if python3 -m espsecure verify_signature --version "${scheme}" \
                --keyfile "${key_file}" "assets/${bin}" > /dev/null 2>&1; then
              echo "${bin} is already signed (v${scheme})"
            else
              echo "Signing ${bin} (v${scheme})"
              python3 -m espsecure sign_data --version "${scheme}" \
                --keyfile "${key_file}" \
                --output "assets/${bin}.signed" "assets/${bin}"
              mv "assets/${bin}.signed" "assets/${bin}"
              # Belt and braces: never publish an image that does not verify.
              python3 -m espsecure verify_signature --version "${scheme}" \
                --keyfile "${key_file}" "assets/${bin}"
            fi
            md5=$(md5sum "assets/${bin}" | head -c 32)
            # Refresh the standalone checksum assets the build uploaded, which
            # went stale when the binary was signed.
            printf '%s' "${md5}" > "assets/${bin}.md5"
            sha256sum "assets/${bin}" | head -c 64 > "assets/${bin}.sha256"
            for manifest in assets/*.manifest.json; do
              jq --arg path "${bin}" --arg md5 "${md5}" \
                '.builds[].ota |= (if .path == $path then .md5 = $md5 else . end)' \
                "${manifest}" > "${manifest}.tmp"
              mv "${manifest}.tmp" "${manifest}"
            done
          done
          rm -f "${key_file_v2}" "${key_file_v1}"

      - name: Patch manifests with current release body
        env:
          RELEASE_SUMMARY: ${{ steps.find.outputs.body }}
          RELEASE_URL: ${{ steps.find.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p patched
          for manifest in assets/*.manifest.json; do
            jq --arg summary "${RELEASE_SUMMARY}" --arg url "${RELEASE_URL}" \
              '.builds[].ota |= (.summary = $summary | .release_url = $url)' \
              "${manifest}" > "patched/$(basename "${manifest}")"
          done

      - name: Re-upload patched manifests to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.find.outputs.release_id }}
        run: |
          set -euo pipefail
          # Upload by release id rather than `gh release upload <tag>
          # --clobber` for the same reason as the download step: draft-by-tag
          # resolution is unreliable. Clobber semantics are replicated by
          # deleting any same-named asset before uploading.
          if ! existing=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" \
            --paginate \
            --jq '.[] | "\(.id)\t\(.name)"'); then
            echo "::error::Failed to list draft release assets"
            exit 1
          fi
          shopt -s nullglob
          # Patched manifests plus the (now signed) OTA binaries they
          # reference and their refreshed checksum files.
          for file in patched/*.manifest.json assets/*.ota.bin assets/*.ota.bin.md5 assets/*.ota.bin.sha256; do
            name=$(basename "${file}")
            case "${name}" in
              *.json) content_type="application/json" ;;
              *) content_type="application/octet-stream" ;;
            esac
            asset_id=$(awk -F'\t' -v name="${name}" '$2 == name {print $1; exit}' <<< "${existing}")
            if [[ -n "${asset_id}" ]]; then
              echo "Deleting existing asset ${name} (${asset_id})"
              gh api "repos/${GH_REPO}/releases/assets/${asset_id}" \
                --method DELETE --silent
            fi
            echo "Uploading ${name}"
            gh api --method POST \
              -H "Content-Type: ${content_type}" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "${file}" --silent
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.find.outputs.release_id }}
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          set -euo pipefail
          # Publish by id, not `gh release edit <tag> --draft=false`: besides
          # the unreliable draft-by-tag resolution, gh sends a PATCH with only
          # draft=false - and updating a draft without re-sending tag_name
          # resets its tag to an untagged-* placeholder, which would then be
          # published as the release tag.
          gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            --method PATCH \
            --field "tag_name=${TAG}" \
            --field "name=${TAG}" \
            --field "draft=false" \
            --silent
          echo "Published ${TAG}"
