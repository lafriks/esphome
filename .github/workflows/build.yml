name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release-drafter' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read pinned ESPHome version
    runs-on: ubuntu-latest
    outputs:
      esphome-version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read .esphome-version
        id: read
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < .esphome-version)
          if [[ -z "${version}" ]]; then
            echo "::error::.esphome-version is empty"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build to Draft Release
    needs: version
    uses: esphome/workflows/.github/workflows/build-to-draft-release.yml@cc3e76de337dc59bc1cba8da58d963cd23b873f1  # 2026.9.0
    with:
      esphome-version: ${{ needs.version.outputs.esphome-version }}
